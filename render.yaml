services:
  - type: web
    name: ishara
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: ELEVEN_API_KEY
        sync: false
      - key: ELEVEN_VOICE_ID
        value: aMmeBf0lzDYlouyfqNjh
      - key: PYTHON_VERSION
        value: "3.11.9"
